<section id="beyond" aria-labelledby="beyond-title" class="mx-auto max-w-6xl px-4 py-14 sm:px-6 md:py-18">
  <app-section-heading [index]="6" headingId="beyond-title" [text]="i18n.t(ui.nav.beyond)" />

  <div
    class="reveal flex flex-col gap-8 rounded-2xl border border-line bg-surface p-6 sm:flex-row sm:items-center sm:justify-between sm:p-10"
  >
    <div class="flex items-start gap-5">
      <span
        class="grid size-12 shrink-0 place-items-center rounded-xl bg-accent-soft text-accent"
        aria-hidden="true"
      >
        <app-icon name="activity" class="size-6" />
      </span>
      <div>
        <h3 class="text-xl font-semibold">{{ i18n.t(content.heading) }}</h3>
        @for (paragraph of content.body; track $index) {
          <p class="mt-2 text-lg text-muted">{{ i18n.t(paragraph) }}</p>
        }
      </div>
    </div>

    <app-external-link
      class="shrink-0"
      [href]="content.link.href"
      [showIcon]="false"
      linkClass="inline-flex h-12 items-center gap-2 rounded-lg border border-line px-5 font-semibold transition-colors hover:border-ink"
    >
      <app-icon name="strava" class="size-5 text-[#c43c02] dark:text-[#fc6a2c]" />
      {{ i18n.t(content.link.label) }}
    </app-external-link>
  </div>
</section>
